name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: registry.json matches plugin metadata
        run: |
          python3 - <<'EOF'
          import json, re
          src = open("internal/plugin/types.go", encoding="utf-8").read()
          version = re.search(r'Version\s*=\s*"([^"]+)"', src).group(1)
          repo = re.search(r'GitHubRepository\s*=\s*"([^"]+)"', src).group(1)
          reg = json.load(open("registry.json", encoding="utf-8"))
          assert reg["schema_version"] == 1, "registry schema_version must be 1"
          (p,) = [p for p in reg["plugins"] if p["id"] == "cpa-moderation"]
          assert p["version"] == version, f"registry.json version {p['version']} != plugin Version {version}"
          assert p["repository"] == repo, f"registry.json repository {p['repository']} != {repo}"
          for k in ("id", "name", "description", "author", "repository"):
              assert p.get(k), f"registry.json missing {k}"
          print("registry.json OK:", version)
          EOF
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: CGO_ENABLED=1 go test -race -count=1 ./...
      - name: Admin page script syntax
        run: |
          python3 - <<'EOF'
          import re
          s = open("internal/plugin/web/ui.html", encoding="utf-8").read()
          open("/tmp/ui.js", "w", encoding="utf-8").write(re.search(r"<script>(.*)</script>", s, re.S).group(1))
          EOF
          node --check /tmp/ui.js
      - name: Cross-build smoke test (linux/amd64, windows/amd64)
        run: |
          pip install --quiet ziglang==0.17.1
          bash scripts/build.sh linux/amd64 windows/amd64
          python3 scripts/package.py
          unzip -l dist/release/cpa-moderation_*_linux_amd64.zip
