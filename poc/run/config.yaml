config-version: 8
server:
  host: "127.0.0.1"
  port: 18317
management:
  allow-remote: false
  secret-key: "poc-mgmt-secret"   # test-only; CPA hashes it on first start
  disable-control-panel: true
access:
  api-keys:
    - "sk-poc-image-business"
    - "sk-poc-other"
routing:
  retry:
    request-retry: 2
  cooldown:
    disable-cooling: true
api-keys:
  openai-compatibility:
    - name: "mock-a"
      base-url: "http://127.0.0.1:18080/v1"
      keys:
        - api-key: "upstream-a"
      models:
        - name: "mock-chat"
          alias: "mock-chat"
        - name: "gpt-image-1"
          alias: "gpt-image-1"
          image: true
        - name: "gpt-6-mini"
          alias: "gpt-6-mini"
        - name: "mock-chat"
          alias: "friendly-alias"
  claude:
    - name: "claude-mock"
      base-url: "http://127.0.0.1:18080"
      keys:
        - api-key: "upstream-claude"
      models:
        - name: "claude-mock"
          alias: "claude-mock"
oauth:
  auth-dir: "./auth"
plugins:
  enabled: true
  dir: "plugins"
  configs:
    cpa-mod-probe:
      enabled: true
      priority: 1
      log_file: "probe.jsonl"
